components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        `Authorization: Bearer <token>`.

        * Routes protected by the Cognito authorizer expect the **idToken** returned by `POST /signin`.
        * Guest routes `/guest/sessions/{guestSessionId}/...` expect the **guest session token** returned by `POST /guest/sessions`.
  schemas:
    UpdateGuestSessionDishRequest:
      type: object
      required:
      - dishId
      - quantity
      properties:
        dishId:
          type: string
          description: The ID of the dish to add or remove
          example: dish-123
        quantity:
          type: integer
          description: The quantity of the dish (must be greater than 0)
          example: 2
          minimum: 1
    CreateGuestSessionRequest:
      type: object
      required:
      - groupReservationId
      - guestName
      properties:
        groupReservationId:
          type: string
          description: The ID of the group reservation
          example: group-res-123
        guestName:
          type: string
          description: The name of the guest
          example: John Doe
    CreateGuestSessionResponse:
      type: object
      properties:
        sessionToken:
          type: string
          description: The authentication token for the guest session
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    SubmitGroupPreOrderRequest:
      type: object
      required:
      - reservationId
      properties:
        reservationId:
          type: string
          description: The ID of the reservation (owner of the group)
          example: res-123
    GroupReservationStatusResponse:
      type: object
      properties:
        currentParticipants:
          type: integer
          description: Current number of participants
          example: 3
        maxCapacity:
          type: integer
          description: Maximum capacity for the group
          example: 8
        status:
          type: string
          enum:
          - Active
          - Submitted
          - Expired
          - Cancelled
          description: Current status of the group reservation
          example: Active
    GetGroupReservationResponse:
      type: object
      properties:
        groupReservationId:
          type: string
          description: The ID of the group reservation
          example: group-res-123
        locationId:
          type: string
          description: The ID of the location
          example: loc-456
        restaurantName:
          type: string
          description: Name of the restaurant
          example: The Italian Corner
        locationAddress:
          type: string
          description: Address of the location
          example: 123 Main St, New York, NY
        startTime:
          type: string
          format: date-time
          description: Reservation start time
          example: 2024-12-20 19:00:00+00:00
        endTime:
          type: string
          format: date-time
          description: Reservation end time
          example: 2024-12-20 21:00:00+00:00
        maxGuestCount:
          type: integer
          description: Maximum number of guests allowed
          example: 8
        tableNumber:
          type: integer
          description: Table number for the reservation
          example: 5
        inviterName:
          type: string
          description: Name of the person who invited the guests
          example: Jane Doe
    GetAllSessionsResponse:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        total:
          type: number
          format: decimal
          description: Total cost for all participants
          example: 125.5
    Participant:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Session ID of the participant
          example: session-123
        type:
          type: string
          enum:
          - Owner
          - Guest
          description: Type of participant
          example: Guest
        name:
          type: string
          description: Name of the participant
          example: John Doe
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
          description: Items ordered by the participant
        total:
          type: number
          format: decimal
          description: Total cost for this participant
          example: 45.5
        isSubmitted:
          type: boolean
          description: Whether the participant has submitted their cart
          example: true
    OrderItemResponse:
      type: object
      properties:
        dish:
          $ref: '#/components/schemas/DishResponse'
        quantity:
          type: integer
          description: Quantity ordered
          example: 2
    GetGroupInviteTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: The invite token for the group reservation
          example: inv_token_123456789
    GetOwnerSessionIdResponse:
      type: object
      properties:
        guestSessionId:
          type: string
          description: The guest session ID of the reservation owner
          example: session-owner-123
    DishResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the dish
          example: dish-123
        name:
          type: string
          description: Name of the dish
          example: Spaghetti Carbonara
        description:
          type: string
          description: Description of the dish
          example: Traditional Italian pasta with creamy sauce
        dishType:
          type: string
          description: Type of dish
          enum:
          - Appetizer
          - Main
          - Side
          - Dessert
          - Beverage
          example: Main
        price:
          type: number
          format: decimal
          description: Price of the dish
          example: 22.5
        weight:
          type: string
          description: Weight or portion size
          example: 350g
        calories:
          type: string
          description: Calorie count
          example: 650
        proteins:
          type: string
          description: Protein content in grams
          example: 25g
        fats:
          type: string
          description: Fat content in grams
          example: 18g
        carbohydrates:
          type: string
          description: Carbohydrate content in grams
          example: 65g
        vitamins:
          type: string
          description: Vitamin information
          example: Vitamin C, Vitamin B12
        imageUrl:
          type: string
          nullable: true
          description: URL to the dish image
          example: https://s3.amazonaws.com/images/spaghetti.jpg
        state:
          type: string
          description: Current state of the dish
          enum:
          - Available
          - Unavailable
          - OutOfStock
          example: Available
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
          example: Dish added successfully.
    ErrorResponse:
      type: object
      description: Most errors return `error`; validation errors return `message` and `errorCode`.
      properties:
        error:
          type: string
          example: Missing 'groupReservationId' in path parameters.
        message:
          type: string
          example: Guest session does not belong to this group reservation.
        errorCode:
          type: string
          example: GroupReservationSubmitted
