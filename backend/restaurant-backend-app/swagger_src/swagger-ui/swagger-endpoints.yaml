      description: 'Only the owner of the parent reservation. Returns every session of the group (the owner session has `type:
        Owner`) with dishes, per-participant totals and the grand total.'
      operationId: getAllSessionsForGroup
      parameters:
      - name: groupReservationId
        in: path
        required: true
        description: The ID of the group reservation
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllSessionsResponse'
        '400':
          description: Missing groupReservationId
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Cognito token
          content: *id001
        '403':
          description: Not the owner of the reservation
          content: *id001
        '404':
          description: Group reservation or reservation not found
          content: *id001
  /guest/groups/{groupReservationId}/sessions/{guestSessionId}:
    delete:
      tags:
      - Guest Sessions
      summary: Delete guest session
      description: Deletes a guest session from a group reservation
      operationId: deleteGuestSession
      parameters:
      - name: groupReservationId
        in: path
        required: true
        description: The ID of the group reservation
        schema:
          type: string
      - name: guestSessionId
        in: path
        required: true
        description: The ID of the guest session to delete
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Guest session deleted successfully
          content:
            application/json:
              schema:
                type: object
                description: Updated snapshot of the group reservation
        '400':
          description: |-
            Bad request. Missing path parameter -> `{ "error": "..." }`. Business validation errors -> `{ "message": "...", "errorCode": "<string>" }`:
            - `errorCode: "GroupReservationSubmitted"` - the group reservation is already submitted.
            - `errorCode: "GroupReservationExpired"` - the group reservation is closed.
            - `errorCode: "Unknown"` - the guest session does not belong to this group reservation.
            - `errorCode: "Unknown"` - the session is the owner's session (it cannot be deleted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - no authorizer claims / no `sub` claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - the caller is not the owner of the parent reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group reservation, parent reservation or guest session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
